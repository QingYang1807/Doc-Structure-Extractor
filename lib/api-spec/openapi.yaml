openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: extraction
    description: Document structured extraction operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /extract:
    post:
      operationId: extractDocument
      tags: [extraction]
      summary: Extract structured data from a document
      description: Analyzes document text and extracts structured fields based on the selected template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
      responses:
        "200":
          description: Extraction successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /markdown-extract:
    post:
      operationId: markdownExtract
      tags: [extraction]
      summary: Convert a document to full Markdown
      description: Converts any document (text or images) into a complete, high-fidelity Markdown representation. Cross-page tables are merged; images are replaced with detailed text descriptions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkdownExtractRequest"
      responses:
        "200":
          description: Conversion successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkdownExtractResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /qa:
    post:
      operationId: documentQa
      tags: [extraction]
      summary: Answer a question about a document with evidence
      description: Answers a natural language question using document content, returning a concise answer and cited evidence quotes from the original text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QaRequest"
      responses:
        "200":
          description: Answer generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /validate:
    post:
      operationId: validateDocument
      tags: [extraction]
      summary: Validate document rules and detect issues
      description: Detects date conflicts, amount inconsistencies, missing required fields, and other rule violations in a document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Validation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /segment:
    post:
      operationId: segmentDocument
      tags: [extraction]
      summary: Segment document into labeled clause cards
      description: Splits a document into clause-level segments, each with a label, type, and full text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentRequest"
      responses:
        "200":
          description: Segmentation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /history:
    get:
      operationId: getHistory
      tags: [extraction]
      summary: Get extraction history
      description: Returns the most recent extraction jobs
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: History retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
  /history/{id}:
    get:
      operationId: getHistoryItem
      tags: [extraction]
      summary: Get a single extraction job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteHistoryItem
      tags: [extraction]
      summary: Delete an extraction job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ExtractRequest:
      type: object
      properties:
        text:
          type: string
          description: The document text to extract information from (provide either text or imageData)
        imageData:
          type: array
          items:
            type: string
          description: Base64-encoded image data URIs for image/scanned-PDF extraction (provide either text or imageData)
        template:
          type: string
          enum:
            - contract
            - invoice
            - resume
            - general
            - custom
          description: The extraction template to use
        customFields:
          type: array
          items:
            type: string
          description: Custom field names to extract (used when template is 'custom')
      required:
        - template
    ExtractedField:
      type: object
      properties:
        key:
          type: string
          description: Field name
        value:
          type: string
          description: Extracted value
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
          description: Confidence level of extraction
      required:
        - key
        - value
        - confidence
    ExtractResponse:
      type: object
      properties:
        id:
          type: integer
          description: Job ID
        template:
          type: string
          description: Template used
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedField"
        rawJson:
          type: object
          description: Raw extraction result as JSON object
          additionalProperties: true
        summary:
          type: string
          description: AI-generated summary of extracted information
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - template
        - fields
        - rawJson
        - createdAt
    ExtractionJob:
      type: object
      properties:
        id:
          type: integer
        template:
          type: string
        textPreview:
          type: string
          description: First 200 chars of the document
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedField"
        rawJson:
          type: object
          additionalProperties: true
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - template
        - textPreview
        - fields
        - rawJson
        - createdAt
    HistoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionJob"
        total:
          type: integer
      required:
        - items
        - total
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    MarkdownExtractRequest:
      type: object
      properties:
        text:
          type: string
          description: The document text to convert (provide either text or imageData)
        imageData:
          type: array
          items:
            type: string
          description: Base64-encoded image data URIs for image/scanned-PDF conversion (provide either text or imageData)
    MarkdownExtractResponse:
      type: object
      properties:
        markdown:
          type: string
          description: The complete Markdown representation of the document
      required:
        - markdown
    ValidateRequest:
      type: object
      properties:
        text:
          type: string
          description: The document text to validate (provide either text or imageData)
        imageData:
          type: array
          items:
            type: string
          description: Base64-encoded image data URIs for image/scanned-PDF validation
      anyOf:
        - required: [text]
        - required: [imageData]
    ValidateIssue:
      type: object
      properties:
        severity:
          type: string
          enum: [error, warning, info]
          description: Issue severity level
        type:
          type: string
          enum: [date_conflict, amount_inconsistency, missing_field, logic_error, format_error, other]
          description: Category of the validation issue
        description:
          type: string
          description: Human-readable description of the issue
        location:
          type: string
          description: Where in the document the issue was found (clause, paragraph, or field reference)
        evidence:
          type: string
          description: Verbatim quote from the document showing the problematic content
      required:
        - severity
        - type
        - description
    ValidateResponse:
      type: object
      properties:
        passed:
          type: boolean
          description: True if no errors were found (warnings/info may still be present)
        summary:
          type: string
          description: One-sentence overall assessment of the document validity
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidateIssue"
          description: Array of detected issues, sorted by severity
      required:
        - passed
        - summary
        - issues
    SegmentRequest:
      type: object
      properties:
        text:
          type: string
          description: The document text to segment (provide either text or imageData)
        imageData:
          type: array
          items:
            type: string
          description: Base64-encoded image data URIs for image/scanned-PDF segmentation
      anyOf:
        - required: [text]
        - required: [imageData]
    ClauseCard:
      type: object
      properties:
        index:
          type: integer
          description: 1-based clause index
        label:
          type: string
          description: Short title/label for the clause (e.g. "付款条款", "违约责任")
        type:
          type: string
          enum: [definitions, obligations, payment, deadline, liability, termination, dispute, misc, preamble, signature]
          description: Semantic type of the clause
        content:
          type: string
          description: Full verbatim text of the clause
        summary:
          type: string
          description: One-sentence plain-language summary of the clause
      required:
        - index
        - label
        - type
        - content
        - summary
    SegmentResponse:
      type: object
      properties:
        clauses:
          type: array
          items:
            $ref: "#/components/schemas/ClauseCard"
          description: Ordered array of segmented clause cards
        totalClauses:
          type: integer
          description: Total number of clauses found
      required:
        - clauses
        - totalClauses
    QaRequest:
      type: object
      properties:
        text:
          type: string
          description: The document text to query (provide either text or imageData)
        imageData:
          type: array
          items:
            type: string
          description: Base64-encoded image data URIs for image/scanned-PDF querying (provide either text or imageData)
        question:
          type: string
          description: The natural language question to answer using the document
      required:
        - question
    QaEvidenceItem:
      type: object
      properties:
        quote:
          type: string
          description: Verbatim quote from the document that supports the answer
        context:
          type: string
          description: Brief explanation of how this quote relates to the question
      required:
        - quote
        - context
    QaResponse:
      type: object
      properties:
        answer:
          type: string
          description: Concise answer to the question, or an explicit statement that the document does not contain the answer
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/QaEvidenceItem"
          description: Array of verbatim quotes from the document that support the answer
      required:
        - answer
        - evidence
